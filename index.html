<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisaSlot Pro Admin</title><style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#18202a}.wrap{max-width:1180px;margin:30px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:26px;font-weight:800}.sub{color:#667085}.card{background:white;border:1px solid #e4e7ec;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:14px;background:#f8fafc;border-radius:10px}.stat b{display:block;font-size:24px;margin-top:4px}.form{display:grid;grid-template-columns:1.2fr 1.2fr .8fr auto;gap:10px;align-items:end}.field label{font-size:12px;color:#667085;display:block;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff}.muted{background:#eef2f6}.danger{background:#fee4e2;color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eaecf0;font-size:13px;vertical-align:top}.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#ecfdf3;color:#027a48}.pill.SUSPENDED{background:#fff7ed;color:#c2410c}.pill.REVOKED,.pill.EXPIRED{background:#fef3f2;color:#b42318}.actions{display:flex;gap:5px;flex-wrap:wrap}.msg{margin:8px 0;color:#344054}.login{max-width:420px;margin:80px auto}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
</style></head><body><div id="login" class="card login"><div class="brand">VisaSlot Pro</div><p class="sub">Owner Admin Dashboard</p><div class="field"><label>Admin token</label><input id="token" type="password" placeholder="Enter ADMIN_TOKEN"></div><button class="btn primary" style="margin-top:10px" onclick="login()">Sign in</button><div id="loginMsg" class="msg"></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><div class="brand">VisaSlot Pro Admin</div><div class="sub">License & customer management</div></div><button class="btn muted" onclick="logout()">Sign out</button></div>
<div class="grid"><div class="stat">Total licenses<b id="total">0</b></div><div class="stat">Active<b id="active">0</b></div><div class="stat">Suspended<b id="suspended">0</b></div><div class="stat">Expired/Revoked<b id="inactive">0</b></div></div>
<div class="card"><h3>Create license</h3><div class="form"><div class="field"><label>Customer</label><input id="customer" placeholder="ABC Visa Services"></div><div class="field"><label>Email</label><input id="email" placeholder="agent@example.com"></div><div class="field"><label>Plan</label><select id="days"><option value="30">30 days — ₹2,199</option><option value="60">60 days — ₹3,999</option><option value="90" selected>90 days — ₹5,199</option></select></div><button class="btn primary" onclick="createLicense()">Create</button></div><div id="createMsg" class="msg"></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Licenses</h3><button class="btn muted" onclick="load()">Refresh</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Customer</th><th>License</th><th>Plan</th><th>Status</th><th>Expires</th><th>Device</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
let token=localStorage.getItem('vsp_admin_token')||'';const $=id=>document.getElementById(id);function headers(){return {'content-type':'application/json','authorization':'Bearer '+token}}function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');load()}function login(){token=$('token').value.trim();if(!token)return;$('loginMsg').textContent='Checking…';fetch('/admin/licenses',{headers:headers()}).then(r=>{if(!r.ok)throw 0;localStorage.setItem('vsp_admin_token',token);showApp()}).catch(()=>{$('loginMsg').textContent='Invalid admin token.'})}function logout(){localStorage.removeItem('vsp_admin_token');location.reload()}
async function load(){const r=await fetch('/admin/licenses',{headers:headers()});if(r.status===401)return logout();const data=await r.json();const now=Date.now();data.forEach(l=>{if(l.status==='ACTIVE'&&new Date(l.expiresAt)<=new Date())l.status='EXPIRED'});$('total').textContent=data.length;$('active').textContent=data.filter(x=>x.status==='ACTIVE').length;$('suspended').textContent=data.filter(x=>x.status==='SUSPENDED').length;$('inactive').textContent=data.filter(x=>x.status==='REVOKED'||x.status==='EXPIRED').length;$('rows').innerHTML=data.map(l=>`<tr><td><b>${esc(l.customer||'—')}</b><br><span class="sub">${esc(l.email||'')}</span></td><td><code>${esc(l.licenseKey)}</code></td><td>${l.plan}<br>₹${l.priceINR}</td><td><span class="pill ${l.status}">${l.status}</span></td><td>${fmt(l.expiresAt)}</td><td>${l.installationId?'Authorized':'Not activated'}</td><td><div class="actions">${l.status==='ACTIVE'?`<button class="btn danger" onclick="status('${l.licenseKey}','SUSPENDED')">Suspend</button>`:`<button class="btn muted" onclick="status('${l.licenseKey}','ACTIVE')">Activate</button>`}${l.status!=='REVOKED'?`<button class="btn danger" onclick="status('${l.licenseKey}','REVOKED')">Revoke</button>`:''}<button class="btn muted" onclick="renew('${l.licenseKey}',${l.days})">Renew</button><button class="btn muted" onclick="resetDevice('${l.licenseKey}')">Reset device</button></div></td></tr>`).join('')}
async function createLicense(){const body={customer:$('customer').value,email:$('email').value,days:Number($('days').value)};const r=await fetch('/admin/licenses',{method:'POST',headers:headers(),body:JSON.stringify(body)});const j=await r.json();if(!r.ok){$('createMsg').textContent=j.message||'Error';return}$('createMsg').innerHTML='Created: <code>'+j.licenseKey+'</code>'; $('customer').value='';$('email').value='';load()}
async function status(key,status){if(status==='REVOKED'&&!confirm('Revoke this license?'))return;await fetch('/admin/licenses/'+encodeURIComponent(key)+'/status',{method:'POST',headers:headers(),body:JSON.stringify({status})});load()}
async function renew(key,current){const v=prompt('Renew for how many days? Enter 30, 60 or 90.',String(current));if(!v)return;const days=Number(v);if(![30,60,90].includes(days))return alert('Use 30, 60 or 90.');await fetch('/admin/licenses/'+encodeURIComponent(key)+'/renew',{method:'POST',headers:headers(),body:JSON.stringify({days})});load()}
async function resetDevice(key){if(!confirm('Reset the authorized device?'))return;await fetch('/admin/licenses/'+encodeURIComponent(key)+'/reset-device',{method:'POST',headers:headers()});load()}
function fmt(x){return new Date(x).toLocaleDateString()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(token){$('token').value=token;showApp()}
</script></body></html>
